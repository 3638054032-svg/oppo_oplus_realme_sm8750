name: 6.6.118 欧加真OKI内核快速构建（完整树·LLCC bus_dcvs 内置版）

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k-llcc'
  CCACHE_KEY: ccache-ecsv4-6.6.118-full
  # 官方完整内核 + 配套 overlay/设备树 仓库（含 qcom dcvs 全套驱动）
  FULL_REPO: 'OnePlusOSS/android_kernel_oneplus_sm8750'
  MOD_REPO:  'OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8750'
  TREE_BRANCH: 'oneplus/sm8750_b_16.0.0_oneplus_13'

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(BakaSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认BakaSU)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''
      fengchi_enable:
        description: '是否打入风驰HMBIRD补丁(默认false:先做LLCC验证版;完整树与cctv18的风驰集成不同,需使用适配完整树的补丁 other_patch/fengchi_fulltree.patch,未适配前请勿开启)'
        required: true
        type: boolean
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      # =====================================================================
      # 关键改动①：源码由 cctv18 的 common 精简树，换成“官方完整 msm-kernel +
      # 配套 overlay/设备树”，按官方 manifest 布局拼装（这样才有 qcom dcvs 驱动）。
      # 工具链(clang18 r510928 + build-tools)与你旧 yml 完全一致。
      # 布局（均在 kernel_workspace/ 下）：
      #   kernel_platform/msm-kernel/                 完整内核
      #   kernel_platform/qcom|build|oplus/...        modules 仓库的 kernel_platform/
      #   vendor/                                     modules 仓库顶层 vendor/
      # =====================================================================
      - name: 安装环境依赖+拼装官方完整内核树及llvm-Clang18工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"

          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev &

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &

          echo "正在下载官方【完整内核】源码..."
          aria2c -s16 -x16 -k1M "https://github.com/${FULL_REPO}/archive/refs/heads/${TREE_BRANCH}.zip" -o kernel.zip &

          echo "正在下载配套 overlay/设备树(modules)..."
          aria2c -s16 -x16 -k1M "https://github.com/${MOD_REPO}/archive/refs/heads/${TREE_BRANCH}.zip" -o modules.zip &

          echo "正在下载llvm-clang18工具链..."
          mkdir -p clang18
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &

          echo "正在下载构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &

          wait
          echo "下载完成，开始拼装完整内核树..."
          unzip -q clang.zip -d clang18 && rm -f clang.zip
          unzip -q build-tools.zip && rm -f build-tools.zip

          mkdir -p kernel_platform
          mkdir -p ktmp && unzip -q kernel.zip -d ktmp
          mv ktmp/${FULL_REPO##*/}-* kernel_platform/msm-kernel
          rm -rf ktmp kernel.zip

          mkdir -p mtmp && unzip -q modules.zip -d mtmp
          MODDIR="$(ls -d mtmp/${MOD_REPO##*/}-*)"
          cp -a "$MODDIR/kernel_platform/." kernel_platform/
          cp -a "$MODDIR/vendor" ./vendor
          rm -rf mtmp modules.zip

          # 校验 overlay 软链接已解析、dcvs 驱动确实存在（失败即终止）
          test -f kernel_platform/msm-kernel/kernel/oplus_cpu/Kconfig
          test -d kernel_platform/qcom/opensource/devicetree
          test -f vendor/oplus/kernel/cpu/Kconfig
          test -f kernel_platform/msm-kernel/drivers/soc/qcom/dcvs/dcvs.c
          test -f kernel_platform/msm-kernel/drivers/interconnect/qcom/sun.c
          echo "完整内核树拼装完成，dcvs 驱动就位！"

          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true
          for f in kernel_platform/msm-kernel/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译（首次换完整树属正常）..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi

      - name: 初始化并配置ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          mkdir -p "$CCACHE_DIR"
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          echo "ccache初始状态:"
          ccache -s
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      # 内核源码根目录（后续所有补丁/配置都打到这里）
      - name: 添加KernelSU
        id: ksu_version
        run: |
          set -e
          K=kernel_platform/msm-kernel
          cd kernel_workspace/$K
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" || ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            echo "正在配置BakaSU..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            cd ../drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          K=kernel_platform/msm-kernel
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/69_hide_stuff.patch -O ./$K/69_hide_stuff.patch
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./$K/
            cp ./susfs4ksu/kernel_patches/fs/* ./$K/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./$K/include/linux/
            cd $K
            patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            cd - >/dev/null
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU 添加susfs补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./$K/KernelSU/
            cd $K/KernelSU
            patch -p1 -F 3 < 10_enable_susfs_for_ksu.patch || true
          fi

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          K=kernel_platform/msm-kernel
          git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR
          cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./$K/
          cp ./$GITHUB_ACTOR/zram_patch/lz4armv8.S ./$K/lib
          cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./$K/
          cd $K
          git apply -p1 < 001-lz4.patch || true
          patch -p1 -F 3 < 002-zstd.patch || true

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          K=kernel_platform/msm-kernel
          if [ ! -d "SukiSU_patch" ]; then
            git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          fi
          cd $K
          cp -r ../../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true

      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          D=kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> $D
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $D
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $D
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $D
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $D
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $D
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $D
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $D
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $D
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $D
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $D
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $D
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $D
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $D
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $D

      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          K=kernel_platform/msm-kernel
          D=$K/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU=y" >> $D
          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> $D
          fi
          echo "CONFIG_TMPFS_XATTR=y" >> $D
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $D
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> $D
            echo "CONFIG_CRYPTO_LZ4HC=y" >> $D
            echo "CONFIG_CRYPTO_LZ4K=y" >> $D
            echo "CONFIG_CRYPTO_LZ4KD=y" >> $D
            echo "CONFIG_CRYPTO_842=y" >> $D
          fi
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> $D
          # 经典 make 构建不经过 build.config.gki，无需 check_defconfig；存在则去掉该检查
          sed -i 's/check_defconfig//' $K/build.config.gki 2>/dev/null || true
          echo "CONFIG_HEADERS_INSTALL=n" >> $D
          cd $K
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/cve-2026-43499-rtmutex-6.6.patch
          patch -p1 -F 3 < cve-2026-43499-rtmutex-6.6.patch
          
          
          
      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          cd kernel_workspace
          K=kernel_platform/msm-kernel
          D=$K/arch/arm64/configs/gki_defconfig
          echo "CONFIG_BPF_STREAM_PARSER=y" >> $D
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> $D
          echo "CONFIG_NETFILTER_XT_SET=y" >> $D
          echo "CONFIG_IP_SET=y" >> $D
          echo "CONFIG_IP_SET_MAX=65534" >> $D
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> $D
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> $D
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> $D
          echo "CONFIG_IP_SET_HASH_IP=y" >> $D
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> $D
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> $D
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> $D
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> $D
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> $D
          echo "CONFIG_IP_SET_HASH_MAC=y" >> $D
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> $D
          echo "CONFIG_IP_SET_HASH_NET=y" >> $D
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> $D
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> $D
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> $D
          echo "CONFIG_IP_SET_LIST_SET=y" >> $D
          echo "CONFIG_IP6_NF_NAT=y" >> $D
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> $D
          cd $K
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            echo "正在添加BBR等拥塞控制算法..."
            cd kernel_workspace
            D=kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> $D
            echo "CONFIG_TCP_CONG_BBR=y" >> $D
            echo "CONFIG_TCP_CONG_CUBIC=y" >> $D
            echo "CONFIG_TCP_CONG_VEGAS=y" >> $D
            echo "CONFIG_TCP_CONG_NV=y" >> $D
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> $D
            echo "CONFIG_TCP_CONG_HTCP=y" >> $D
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> $D
            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> $D
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> $D
            fi
          fi

      - name: 启用 Droidspaces 容器支持
        run: |
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            echo "正在启用 Droidspaces 容器支持..."
            cd kernel_workspace/kernel_platform/msm-kernel
            D=./arch/arm64/configs/gki_defconfig
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "CONFIG_PID_NS=y" >> $D
            echo "CONFIG_IPC_NS=y" >> $D
            echo "CONFIG_USER_NS=y" >> $D
            echo "CONFIG_SYSVIPC=y" >> $D
            echo "CONFIG_DEVTMPFS=y" >> $D
            echo "CONFIG_NAMESPACES=y" >> $D
            echo "CONFIG_POSIX_MQUEUE=y" >> $D
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> $D
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> $D
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> $D
            echo "CONFIG_NTSYNC=y" >> $D
            if [[ "${{ github.event.inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "正在启用容器环境扩展支持..."
              echo "CONFIG_BT_HCIVHCI=y" >> $D
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> $D
              wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch
              patch -p1 -F 3 < evdi_drm.patch || true
              echo "CONFIG_DRM_LINDROID_EVDI=y" >> $D
            fi
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          echo "正在启用ADIOS IO调度器…"
          cd kernel_workspace
          D=kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> $D
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> $D

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          echo "正在启用Re-Kernel支持…"
          cd kernel_workspace
          D=kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
          echo "CONFIG_REKERNEL=y" >> $D

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          echo "正在启用内核级基带保护支持…"
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
          cd kernel_platform/msm-kernel
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 添加制作名称
        run: |
          cd kernel_workspace
          F=kernel_platform/msm-kernel/scripts/setlocalversion
          D=kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            echo "当前内核版本后缀：${{ github.event.inputs.kernel_suffix }}"
            sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$F"
            sudo sed -i 's/-4k/-${{ github.event.inputs.KERNEL_SUFFIX }}/g' "$D"
          else
            echo "当前内核版本后缀：${{ env.KERNEL_NAME }}"
            sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" "$F"
            sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' "$D"
          fi
          sed -i 's/${scm_version}//' "$F"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$D"

      - name: 设置节拍HZ1000（保持默认空闲无时钟，不启用NO_HZ_FULL）
        run: |
          cd kernel_workspace
          D=kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig
          sed -i '/CONFIG_HZ_250/d' $D
          sed -i '/CONFIG_HZ_1000/d' $D
          sed -i '/CONFIG_HZ=/d' $D
          
          # 新增 LLCC BW MON sysfs 节点开启
          echo "CONFIG_QCOM_LLCC_BWMON_SYSFS=y" >> $D
          echo "CONFIG_HZ_1000=y" >> $D
          echo "CONFIG_HZ=1000" >> $D
          
          echo "==== HZ配置检查（应只显示1000）===="
          grep -nE "CONFIG_HZ" $D
          if grep -q "CONFIG_NO_HZ_FULL=y" $D; then echo "ERROR: 不应启用NO_HZ_FULL"; exit 1; fi
          echo "已确认：HZ=1000，动态时钟保持 NO_HZ_IDLE"

      # =====================================================================
      # 关键改动②：生成配置——gki_defconfig + 官方 sun vendor 片段，
      # 再把 LLCC DCVS 整条依赖链【内置 =y】，硬性校验符号后才允许编译。
      # 这是 /sys/devices/system/cpu/bus_dcvs/LLCC 节点出现的核心。
      # =====================================================================
      - name: 合并 sun vendor 片段并内置 LLCC DCVS（生成 bus_dcvs 节点）
        run: |
          set -e
          cd kernel_workspace
          export PATH="$PWD/clang18/bin:$PWD/build-tools/bin:$PATH"
          K=kernel_platform/msm-kernel
          cd $K
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          echo "==== 1) gki_defconfig（含上面追加的 KSU/HZ 等配置）===="
          make O=out ARCH=arm64 gki_defconfig
          echo "==== 2) 合并官方 sun_perf / oplus_common vendor 片段 ===="
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -O out -m out/.config \
              arch/arm64/configs/vendor/sun_perf.config \
              arch/arm64/configs/vendor/sun_oplus_common.config
          echo "==== 3) LLCC DCVS 依赖链内置 =y ===="
          CFG="./scripts/config --file out/.config"
          $CFG --enable ARM_SCMI_PROTOCOL --enable ARM_SCMI_TRANSPORT_SMC
          $CFG --enable QCOM_CPUCP --enable QCOM_CPUCP_FAST
          $CFG --enable QTI_SCMI_VENDOR_PROTOCOL --enable QTI_SCMI_PMU_PROTOCOL
          $CFG --enable QTI_QCOM_SCMI_CLIENT
          $CFG --enable QCOM_PMU_LIB
          $CFG --enable QCOM_DCVS --enable QCOM_DCVS_FP
          $CFG --enable QCOM_MEMLAT --enable QCOM_BWMON
          $CFG --enable OF_RESERVED_MEM --enable QCOM_COMMAND_DB --enable QCOM_SCM
          $CFG --enable QCOM_RPMH --enable QCOM_RPMHPD
          $CFG --enable INTERCONNECT --enable INTERCONNECT_QCOM --enable INTERCONNECT_QCOM_RPMH
          $CFG --enable INTERCONNECT_QCOM_SUN --enable INTERCONNECT_QCOM_BCM_VOTER
          $CFG --enable INTERCONNECT_QCOM_QOS --enable INTERCONNECT_QCOM_KERA
          # 双保险：强制节拍 1000（gki 默认 250），不启用 NO_HZ_FULL
          $CFG --enable HZ_1000 --disable HZ_250 --disable HZ_300 --disable HZ_100
          $CFG --enable NO_HZ_IDLE --disable NO_HZ_FULL
          make O=out ARCH=arm64 olddefconfig
          echo "==== 4) 硬性校验：关键符号必须 =y，否则直接失败 ===="
          for s in CONFIG_QCOM_DCVS CONFIG_QCOM_MEMLAT CONFIG_QCOM_BWMON CONFIG_QCOM_PMU_LIB \
                   CONFIG_QTI_SCMI_VENDOR_PROTOCOL CONFIG_QTI_SCMI_PMU_PROTOCOL CONFIG_QCOM_CPUCP \
                   CONFIG_INTERCONNECT_QCOM_SUN CONFIG_QCOM_RPMH CONFIG_HZ_1000; do
            grep -q "^$s=y" out/.config || { echo "!! 缺少内置符号 $s，终止构建"; exit 1; }
          done
          echo "全部关键符号已内置："
          grep -E 'CONFIG_QCOM_DCVS=|CONFIG_QCOM_MEMLAT=|CONFIG_QCOM_BWMON=|CONFIG_QCOM_PMU_LIB=|CONFIG_INTERCONNECT_QCOM_SUN=|CONFIG_HZ=' out/.config

      - name: 应用 LLCC BW MON 补丁
        run: |
          cd kernel_workspace/kernel_platform/msm-kernel
          echo "应用 llcc-bwmon.patch ..."
          patch -p1 < ../../llcc-bwmon.patch || true

      # 风驰(SCX/HMBIRD)：默认关闭！
      # 你仓库里的 other_patch/fengchi.patch 是给 cctv18 common 树用的，实测在官方完整树
      # 上有 5 处调度器核心 hunk 冲突（include/linux/sched.h 与 kernel/sched/core.c），不能直接打。
      # 需要使用“适配完整树”的补丁 other_patch/fengchi_fulltree.patch（rebase 后另行提供）。
      # 请先用默认 false 出 LLCC 验证版；确认开机+节点正常后，再用适配补丁开本开关做实验版。
      - name: （实验·默认关）打入适配完整树的风驰 HMBIRD 补丁
        if: inputs.fengchi_enable
        run: |
          cd kernel_workspace/kernel_platform/msm-kernel
          P="$GITHUB_WORKSPACE/other_patch/fengchi_fulltree.patch"
          if [ ! -f "$P" ]; then
            echo "!! 已开启风驰但未找到适配完整树的 other_patch/fengchi_fulltree.patch"
            echo "!! 原始 fengchi.patch 不能用于完整树，终止以免产出坏包"
            exit 1
          fi
          git apply --check "$P" || { echo "!! 风驰适配补丁仍有冲突"; exit 1; }
          git apply "$P"
          ./scripts/config --file out/.config --enable CONFIG_HMBIRD_SCHED --enable CONFIG_OPLUS_SCHED --enable CONFIG_OPLUS_GAME_OPT
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          echo "风驰(适配完整树)已打入"

      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "编译器信息:"
          echo "Clang版本: $CLANG_VERSION"
          echo "LLD版本: $LLD_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/kernel_platform/msm-kernel
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper 内部环境检查完毕."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh
          chmod +x test-wrapper.sh
          ./test-wrapper.sh date
          ./test-wrapper.sh stat ./Makefile
          chmod +x cc-wrapper ld-wrapper
          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          # 配置已在上一步生成（gki+vendor片段+LLCC内置+HZ1000），这里直接编译 Image
          test -f out/.config || { echo "out/.config 缺失，请检查上一步"; exit 1; }
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "内核编译完成！"
          echo "==== LLCC 节点相关符号最终确认 ===="
          for s in CONFIG_QCOM_DCVS CONFIG_QCOM_MEMLAT CONFIG_QCOM_BWMON CONFIG_INTERCONNECT_QCOM_SUN CONFIG_HZ_1000; do
            grep -q "^$s=y" out/.config && echo "$s = y OK" || echo "$s 缺失!"
          done
          ccache -s
          echo "编译后空间:"
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/kernel_platform/msm-kernel/out/arch/arm64/boot
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x ./kptools-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          rm -f Image
          mv oImage Image

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../kernel_platform/msm-kernel/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip
          fi
          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}_LLCC.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${{ env.KERNEL_NAME }}
          fi
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION (full msm-kernel + LLCC built-in)" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${{ env.KSUVER }}" >> ./ak3.log
          echo "susfs: ${{ github.event.inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ github.event.inputs.kpm_enable }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "IPset: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log
          echo "LLCC bus_dcvs: built-in (=y)" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
          archive: true

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        run: |
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO-OPlus-Realme-build-LLCC"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV

      - name: 创建发布
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 欧加真 ${{ env.KSU_TYPENAME }} SM8750 通用内核(完整树·LLCC内置) | 构建信息
          - 内核版本号: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：欧加真骁龙8Elite通用 ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 内核（一加官方完整 msm-kernel 源码）
          - 本版特性：QCOM DCVS/LLCC 驱动内置，开机即生成 /sys/devices/system/cpu/bus_dcvs/LLCC（available_frequencies/boost_freq 可写/cur_freq/hw_max/hw_min + memlat/bwmon）
          - KSU分支：${{ env.KSU_TYPENAME }}
          - susfs支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持 ：${{ github.event.inputs.kpm_enable }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ github.event.inputs.droidspaces_enable }}
          - ADIOS IO调度器支持：${{ github.event.inputs.adios_enable }}
          - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ github.event.inputs.baseband_guard }}

          ### ✅ 刷入后验证 LLCC 节点（root）
          ```
          su -
          ls /sys/devices/system/cpu/bus_dcvs/LLCC/
          cat /sys/devices/system/cpu/bus_dcvs/LLCC/available_frequencies
          echo 1066000 > /sys/devices/system/cpu/bus_dcvs/LLCC/boost_freq
          cat /sys/devices/system/cpu/bus_dcvs/LLCC/boost_freq
          ```

          ### ⚠️ 关于风驰(SCX/HMBIRD)
          本版已含 HZ=1000；风驰为实验开关(fengchi_enable)，需适配完整树的 fengchi_fulltree.patch，默认关闭时为官方调度器。

          #### ※※※刷写内核有风险，刷入前请务必备份 boot 等关键启动分区!※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
